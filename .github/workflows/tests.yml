name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scripts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Compile scripts
        run: python -m compileall -q .

      - name: Run policy tests
        run: python -m unittest discover -s . -p "test_*policy.py"

      - name: Run plan and manifest tests
        run: >-
          python -m unittest
          test_anchor_manifest.py
          test_bridge_plan.py
          test_relationship_plan.py

      - name: Run backend tests
        run: python -m unittest test_backend_route.py

      - name: Run image safety tests
        run: python -m unittest test_image_safety.py

      - name: Run pixel protection tests
        run: >-
          python -m unittest
          test_pixel_protection.py
          test_adversarial_cases.py

      - name: Run caption tests
        run: python -m unittest test_render_caption.py

      - name: Run workspace tests
        run: python -m unittest test_run_workspace.py
